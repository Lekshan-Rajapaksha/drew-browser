name: Build Windows Application

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install NSIS (Installer Creator)
        run: choco install nsis -y

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Build Windows Application & Installer
        shell: pwsh
        run: |
          .\scripts\build-windows.ps1 -Release -Package

      - name: Upload Windows Executable & Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 72-Browser-Windows
          path: |
            dist/windows/Ardia-Setup.exe
            apps/browser/windows/build/Release/Ardia.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/Ardia-Setup.exe
            apps/browser/windows/build/Release/Ardia.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
