name: Build Windows Application

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install NSIS
        run: choco install nsis -y

      - name: Configure CMake
        run: cmake -S apps/browser/windows -B apps/browser/windows/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Ardia.exe
        run: cmake --build apps/browser/windows/build

      - name: Verify Ardia.exe was created
        shell: pwsh
        run: |
          $exe = "apps/browser/windows/build/Ardia.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build failed: $exe not found!"
            exit 1
          }
          Write-Host "Ardia.exe built successfully."

      - name: Create installer with NSIS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          $buildDir = (Resolve-Path "apps/browser/windows/build").Path
          $outFile  = (Resolve-Path ".").Path + "\dist\windows\Ardia-Setup.exe"
          $nsi      = (Resolve-Path "scripts/windows/ardia-setup.nsi").Path
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            "/DPRODUCT_VERSION=0.2.46" `
            "/DBUILD_DIR=$buildDir" `
            "/DOUT_FILE=$outFile" `
            $nsi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 72-Browser-Windows
          path: |
            dist/windows/Ardia-Setup.exe
            apps/browser/windows/build/Ardia.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/Ardia-Setup.exe
            apps/browser/windows/build/Ardia.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
