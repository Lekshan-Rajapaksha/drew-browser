name: Build Windows Application

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 1: Build the web UI (Vite / pnpm monorepo) ──────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app (Vite)
        working-directory: packages/demo
        run: pnpm build

      # ── Step 2: Copy web build into the Electron app ─────────────────────
      - name: Copy web build into Electron app
        shell: pwsh
        run: |
          $src = "packages/demo/dist"
          $dst = "apps/desktop/web"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Copy-Item $src $dst -Recurse
          Write-Host "Web build copied to $dst"

      # ── Step 3: Install Electron deps and package ─────────────────────────
      - name: Install Electron app dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 4: Upload ────────────────────────────────────────────────────
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ardia-Windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
