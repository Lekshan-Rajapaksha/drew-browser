name: Build Windows Application

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app (Vite)
        working-directory: packages/demo
        run: pnpm build

      - name: Verify browser-safe bundle
        shell: pwsh
        run: |
          $matches = Get-ChildItem "packages/demo/dist/assets/*.js" | Select-String -Pattern "\brequire\("
          if ($matches) { throw "Browser bundle contains CommonJS require calls" }

      - name: Copy web build into Electron app
        shell: pwsh
        run: |
          $src = "packages/demo/dist"
          $dst = "apps/desktop/web"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Copy-Item $src $dst -Recurse
          Write-Host "Web build copied to $dst"

      - name: Install Electron app dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Verify Windows app renders
        working-directory: apps/desktop
        run: npm run dev
        env:
          ARDIA_BACKGROUND: 1
          ARDIA_SMOKE: 1

      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Drew-Windows
          path: |
            apps/desktop/dist/*Drew*.exe
            apps/desktop/dist/*.zip
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/dist/*Drew*.exe
            apps/desktop/dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
